<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dark Mode Assistant</title>
  <style>
    body {
      width: 200px;
      padding: 16px;
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f5f5f5;
      color: #333;
    }
    .dark-mode {
      background-color: #121212;
      color: #e0e0e0;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 34px;
      margin: 10px 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 26px;
      width: 26px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #2196F3;
    }
    input:focus + .slider {
      box-shadow: 0 0 1px #2196F3;
    }
    input:checked + .slider:before {
      transform: translateX(26px);
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h3 {
      margin: 0 0 15px 0;
      color: inherit;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3>Dark Mode</h3>
    <label class="switch">
      <input type="checkbox" id="darkModeToggle">
      <span class="slider"></span>
    </label>
    <p id="status">Off</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
